task: "mmbench_en_full"
dataset_path: lmms-lab/MMBench_EN
dataset_kwargs:
  token: false
test_split: dev
doc_to_visual: !function en_utils.mmbench_doc_to_visual
doc_to_text: !function en_utils.mmbench_doc_to_text
doc_to_target: "answer"
process_results: !function en_utils.mmbench_process_results
output_type: generate_until
metric_list:
  - metric: submission
    aggregation: !function en_utils.mmbench_aggregate_dev_results_submission
    higher_is_better: true
generation_kwargs:
  until:
    - "ASSISTANT:"
  max_new_tokens: 128
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the option's letter from the given choices directly."
model_specific_generation_kwargs:
  llava:
    image_aspect_ratio: original
